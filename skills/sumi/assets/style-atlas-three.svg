    <text x="25" y="34" fill="#555" font-family="Arial,sans-serif" font-size="13" letter-spacing="1.4">LARGE SPLASH FORMS · CAMERA-LED</text>
    <path d="M29 380Q190 375 395 381" stroke="#111" stroke-opacity=".25" fill="none"/>
  </g>
  <g fill="#222" font-family="Arial,sans-serif">
    <g transform="translate(55 586)">
      <text font-family="Georgia,serif" font-size="31">Sumi Original</text>
      <text y="36" font-size="18">Emotional stories · smoother Sumi-e acting</text>
      <text y="69" font-size="16" fill="#555">30fps · action-driven drawing exposures.</text>
      <text y="94" font-size="16" fill="#555">Love, companionship and heartfelt stories.</text>
    </g>
    <g transform="translate(530 586)">
      <text font-family="Georgia,serif" font-size="31">Sumi Light</text>
      <text y="36" font-size="18">Documentaries · colourful brush storytelling</text>
      <text y="69" font-size="16" fill="#555">24 FPS output / character poses on twos.</text>
      <text y="94" font-size="16" fill="#555">Story-selected colour · checked pose sheets.</text>
    </g>
    <g transform="translate(1005 586)">
      <text font-family="Georgia,serif" font-size="31">Sumi Dark</text>
      <text y="36" font-size="18">Dark stories · large brush and splash forms</text>
      <text y="69" font-size="16" fill="#555">Camera-led depth, reveals and ink journeys.</text>
      <text y="94" font-size="16" fill="#555">Black, grey and purposeful dark red.</text>
    </g>
    <path d="M55 731H1445" stroke="#222" stroke-opacity=".2"/>
    <text x="55" y="773" font-size="18">Story first. Visible acting, meaningful camera, weather, sparse transitions and synchronized sound.</text>
    <text x="55" y="809" font-size="14" fill="#666">Schematic onboarding art · specifications, not motion proof · Original 30fps/variable exposures · Light/Dark 24fps/on-twos</text>
  </g>
</svg>
