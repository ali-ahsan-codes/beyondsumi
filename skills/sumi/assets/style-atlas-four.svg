<rect x="40" y="145" width="1360" height="210" rx="5" fill="#fff"/><text x="64" y="188" class="title">01  Sumi Brush</text><text x="64" y="220" class="small">Splatter → draw → redraw</text><text x="64" y="252" class="small">Pressure and stroke order</text>
<g fill="#232321"><circle cx="620" cy="263" r="13"/><circle cx="640" cy="246" r="4"/><circle cx="607" cy="240" r="3"/><circle cx="650" cy="275" r="2"/></g><path d="M770 298 Q817 270 837 219" class="ink" stroke-width="9"/><use href="#branch" x="1000" y="225"/><use href="#branch" x="1220" y="220" transform="rotate(8 1220 260)"/>
