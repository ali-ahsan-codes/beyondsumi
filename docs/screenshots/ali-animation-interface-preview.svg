<text x="902" y="314" font-family="Arial" font-size="10" fill="#c4c7bb">Project title</text><rect x="902" y="323" width="489" height="34" rx="4" fill="#171c17" stroke="#3a4238"/><text x="913" y="345" font-family="Arial" font-size="11" fill="#eee9db">The Lantern Keeper</text><text x="902" y="382" font-family="Arial" font-size="10" fill="#c4c7bb">Genre</text><text x="1150" y="382" font-family="Arial" font-size="10" fill="#c4c7bb">Aspect ratio</text><rect x="902" y="391" width="233" height="34" rx="4" fill="#171c17" stroke="#3a4238"/><rect x="1150" y="391" width="241" height="34" rx="4" fill="#171c17" stroke="#3a4238"/><text x="913" y="413" font-family="Arial" font-size="11" fill="#eee9db">Adventure</text><text x="1160" y="413" font-family="Arial" font-size="11" fill="#eee9db">16:9 · YouTube</text><text x="902" y="450" font-family="Arial" font-size="10" fill="#c4c7bb">Logline</text><rect x="902" y="459" width="489" height="55" rx="4" fill="#171c17" stroke="#3a4238"/><text x="913" y="481" font-family="Arial" font-size="10" fill="#999e8e">A young keeper takes her last lantern to</text><text x="913" y="497" font-family="Arial" font-size="10" fill="#999e8e">guide a stranger home through a storm.</text><text x="902" y="541" font-family="Arial" font-size="10" fill="#c4c7bb">Story / narration</text><rect x="902" y="550" width="489" height="129" rx="4" fill="#171c17" stroke="#3a4238"/><text x="913" y="573" font-family="Arial" font-size="10" fill="#999e8e">On the stormiest night of the year, young lighthouse</text><text x="913" y="590" font-family="Arial" font-size="10" fill="#999e8e">keeper Mira sees a tiny light blinking from the rocks.</text><text x="913" y="607" font-family="Arial" font-size="10" fill="#999e8e">Though the beacon is fading, she carries her last</text><text x="913" y="624" font-family="Arial" font-size="10" fill="#999e8e">lantern down the cliff. A stranded sailor follows its</text><text x="913" y="641" font-family="Arial" font-size="10" fill="#999e8e">glow home; dawn finds the harbor safe.</text><text x="902" y="706" font-family="Arial" font-size="10" fill="#c4c7bb">Audience</text><text x="1150" y="706" font-family="Arial" font-size="10" fill="#c4c7bb">Target length</text><rect x="902" y="715" width="233" height="34" rx="4" fill="#171c17" stroke="#3a4238"/><rect x="1150" y="715" width="241" height="34" rx="4" fill="#171c17" stroke="#3a4238"/><text x="913" y="737" font-family="Arial" font-size="10" fill="#eee9db">Family, ages 8+</text><text x="1160" y="737" font-family="Arial" font-size="10" fill="#eee9db">32 seconds</text><text x="902" y="779" font-family="Arial" font-size="10" fill="#c4c7bb">Characters</text><rect x="902" y="788" width="489" height="72" rx="4" fill="#171c17" stroke="#3a4238"/><text x="913" y="810" font-family="Arial" font-size="10" fill="#999e8e">Mira — young keeper, indigo coat, short dark hair;</text><text x="913" y="827" font-family="Arial" font-size="10" fill="#999e8e">kind, steady voice. Sailor — yellow rain cape;</text><text x="913" y="844" font-family="Arial" font-size="10" fill="#999e8e">no dialogue.</text>
<text x="30" y="943" font-family="Arial" font-size="9" letter-spacing="1.2" fill="#858b7e">ALI ANIMATION · LOCAL STORYBOARD · STATIC INTERFACE PREVIEW</text><text x="866" y="943" font-family="Arial" font-size="9" fill="#858b7e">For interactive samples and real controls, open studio/index.html in the local server.</text>
