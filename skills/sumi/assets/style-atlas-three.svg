      <circle cx="232" cy="63" r="2"/><circle cx="85" cy="115" r="1.6"/><circle cx="282" cy="143" r="4" opacity=".18"/>
    </g>
  </defs>
  <rect width="1500" height="850" fill="#f5f4f0"/>
  <g fill="#202322" font-family="Georgia,serif">
