    <text x="1445" y="61" text-anchor="end" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">THREE FINAL STYLES</text>
  </g>
  <path d="M55 88H1445" stroke="#292d29" stroke-opacity=".25"/>
