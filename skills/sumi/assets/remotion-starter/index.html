<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Beyondsumi · Film preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #11232e;
        color: #f1e9db;
        font: 16px system-ui;
      }
      main {
        min-height: 100vh;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 20px;
        padding: 24px;
      }
      video {
        max-height: 80vh;
        max-width: 95vw;
        display: block;
      }
      footer {
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
      }
      button,
      a {
        font: inherit;
        color: inherit;
      }
      button {
        padding: 10px 16px;
        border: 1px solid #71888a;
        border-radius: 24px;
        background: transparent;
        cursor: pointer;
      }
      a {
        text-underline-offset: 4px;
      }
      #status {
        font-size: 13px;
        color: #afc7c4;
      }
    </style>
    <link rel="stylesheet" href="../delivery-dashboard/brand.css" />
  </head>
  <body class="bs-page">
    <header class="bs-masthead">
      <a class="bs-brand" href="../delivery-dashboard/brand.html"
        ><img src="../delivery-dashboard/logo.png" alt="Beyondsumi ink portal" /><span
          >Beyondsumi</span
        ></a
      ><span>Film preview</span>
    </header>
    <main>
      <video playsinline preload="metadata" src="out/film.mp4" aria-label="Finished film"></video>
      <footer>
        <button id="play">Play</button><button id="replay">Replay</button
        ><button id="mute">Mute</button><button id="full">Fullscreen</button
        ><a href="out/film.mp4" download>Download MP4</a
        ><span role="status" id="status">Ready</span>
      </footer>
    </main>
    <script>
      const video = document.querySelector("video"),
        play = document.querySelector("#play"),
        status = document.querySelector("#status");
      async function start(reset) {
        if (reset || video.ended) video.currentTime = 0;
        try {
          await video.play();
        } catch {
          status.textContent = "Press Play to start";
        }
      }
      play.onclick = () => (video.paused ? start(false) : video.pause());
      document.querySelector("#replay").onclick = () => start(true);
      document.querySelector("#mute").onclick = (e) => {
        video.muted = !video.muted;
        e.target.textContent = video.muted ? "Unmute" : "Mute";
      };
      document.querySelector("#full").onclick = () => video.requestFullscreen();
      video.onplay = () => (play.textContent = "Pause");
      video.onpause = () => (play.textContent = "Play");
      video.onended = () => {
        status.textContent = "Finished";
        play.textContent = "Play again";
      };
      video.ontimeupdate = () =>
        (status.textContent =
          video.currentTime.toFixed(1) + " / " + video.duration.toFixed(1) + "s");
      video.onerror = () =>
        (status.textContent =
          "Your film is being prepared. Your agent will update this preview when the export is ready.");
    </script>
  </body>
</html>
