<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
  <title id="title">Sumi Original, Sumi Light and Sumi Dark</title>
  <desc id="desc">A static teaching atlas. Original preserves a painted landscape and articulated gesture. Light uses colorful pigment and checked pose animation. Dark uses large splash-built subjects and camera-led ink journeys in black, grey and dark red. These schematic illustrations do not demonstrate completed motion.</desc>
