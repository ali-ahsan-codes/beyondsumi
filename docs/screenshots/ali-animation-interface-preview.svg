<text x="30" y="117" font-family="Arial" font-weight="bold" font-size="9" letter-spacing="2" fill="#e4b66e">YOUR STORY. YOUR FRAMES. YOUR MACHINE.</text><text x="30" y="176" font-family="Georgia" font-size="56" fill="#eee9db">Make a story <tspan font-style="italic" fill="#e4b66e">move.</tspan></text><text x="30" y="203" font-family="Arial" font-size="12" fill="#999e8e">A small, private animation workshop. Direct every shot, bring your own voice and artwork, and export without an account, cloud, or AI.</text><text x="952" y="180" font-family="Arial" font-size="9" letter-spacing="1.5" fill="#e4b66e">01 DIRECT</text><text x="1070" y="180" font-family="Arial" font-size="9" letter-spacing="1.5" fill="#858b7e">02 PREVIEW</text><text x="1207" y="180" font-family="Arial" font-size="9" letter-spacing="1.5" fill="#858b7e">03 EXPORT</text>
