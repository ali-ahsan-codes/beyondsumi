<g fill="#232321"><path d="M585 490 Q570 453 614 449 Q669 445 661 494 Q636 523 585 490Z"/><path d="M778 499 Q754 455 794 434 Q825 418 823 454 Q866 433 865 476 Q846 513 778 499Z"/><path d="M993 519 Q974 483 1002 456 Q976 421 989 408 Q1037 432 1019 462 Q1053 443 1084 450 Q1083 483 1030 482 L1031 522Z"/></g><use href="#branch" x="1230" y="440"/>
